name: CODE1 runtime backend staging CI

on:
  push:
    branches:
      - coding/runtime-backend-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Runtime version
        run: node --version

      - name: Syntax check staging modules and Cloudflare functions
        shell: bash
        run: |
          set -euo pipefail
          find backend/staging/src backend/staging/scripts backend/staging/test functions -type f \( -name '*.mjs' -o -name '*.js' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Syntax check Windows staging wrappers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem 'backend/staging/scripts' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse failed: $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Run staging unit and contract tests
        run: node --test backend/staging/test/*.test.mjs

      - name: Install workspace dependencies
        run: npm ci

      - name: Report npm audit details without applying fixes
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/code1-npm-audit.json
          audit_status=$?
          set -e
          node backend/staging/scripts/report-npm-audit.mjs /tmp/code1-npm-audit.json
          echo "NPM_AUDIT_EXIT=$audit_status (nonzero means vulnerabilities were reported; no fix was applied)"

      - name: Compare root regression against known baseline
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/code1-root-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          ROOT_TEST_EXIT=$test_status node backend/staging/scripts/check-root-baseline.mjs /tmp/code1-root-tests.log

      - name: Build existing workspace
        run: npm run build
