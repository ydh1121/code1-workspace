name: CODE1 Planning Material Preview smoke

on:
  push:
    branches:
      - coding/runtime-backend-staging

permissions:
  contents: read

jobs:
  readonly-planning-material-preview-smoke:
    if: contains(github.event.head_commit.message, 'PLANNING_MATERIAL_PREVIEW_SMOKE')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLANNING_MATERIAL_PREVIEW_ORIGIN: https://coding-runtime-backend-stagi.code1-workspace.pages.dev
    steps:
      - uses: actions/checkout@v4
      - name: Runtime version
        run: node --version
      - name: Verify deployed Planning Material REV B without credentials or mutation
        run: node backend/staging/scripts/verify-planning-material-preview-readonly.mjs
